<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGINT OPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#" aria-label="Logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
    </a>
    <h1 class="title">SIGINT OPS</h1>
    <div class="pill"><span class="pill-dot"></span>SECURE • ONLINE</div>
  </header>
  <main class="main">
    <section class="panel">
      <div class="radar" aria-hidden="true">
        <span class="radar-sweep"></span>
        <span class="blip b1"></span>
        <span class="blip b2"></span>
        <span class="blip b3"></span>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-num">24</span><span class="stat-label">Active Signals</span></div>
        <div class="stat"><span class="stat-num">07</span><span class="stat-label">Priority Alerts</span></div>
      </div>
    </section>
    <div class="actions">
      <button class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>New Brief</button>
      <button class="btn" type="button"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>Decode</button>
      <button class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>Request Drone</button>
    </div>
    <div class="cards">
      <article class="card c-green">
        <div class="card-top"><span class="badge critical">Critical</span><span class="status">In Progress</span></div>
        <h2 class="card-title">Operation Nightfall</h2>
        <div class="progress"><div class="track"><i style="--p:65%"></i></div><span class="pct">65%</span></div>
      </article>
      <article class="card c-amber">
        <div class="card-top"><span class="badge high">High</span><span class="status">Analyzing</span></div>
        <h2 class="card-title">Signal Intercept Alpha</h2>
        <div class="progress"><div class="track"><i style="--p:40%"></i></div><span class="pct">40%</span></div>
      </article>
      <article class="card c-green">
        <div class="card-top"><span class="badge medium">Medium</span><span class="status">Pending</span></div>
        <h2 class="card-title">Asset Recovery</h2>
        <div class="progress"><div class="track"><i style="--p:15%"></i></div><span class="pct">15%</span></div>
      </article>
      <article class="card c-amber">
        <div class="card-top"><span class="badge high">High</span><span class="status">Active</span></div>
        <h2 class="card-title">Cyber Defense Grid</h2>
        <div class="progress"><div class="track"><i style="--p:80%"></i></div><span class="pct">80%</span></div>
      </article>
    </div>
    <div class="alert" role="alert"><span class="alert-dot"></span>THREAT DETECTED</div>
  </main>
  <nav class="nav">
    <input type="radio" name="tab" id="t1" checked hidden>
    <input type="radio" name="tab" id="t2" hidden>
    <input type="radio" name="tab" id="t3" hidden>
    <label class="nav-item n1" for="t1"><svg viewBox="0 0 24 24"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg><span>Dashboard</span></label>
    <label class="nav-item n2" for="t2"><svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg><span>Feed</span></label>
    <label class="nav-item n3" for="t3"><svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>Brief</span></label>
    <button class="help" type="button" aria-label="Help">?</button>
  </nav>
</body>
</html>
